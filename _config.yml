# Book settings
title: Interactive Learning Book
author: Xavier Chee
logo: ""

# Execution settings
execute:
  execute_notebooks: "off"  # Don't execute during build
  allow_errors: false
  timeout: 30

parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
    - substitution

# Launch buttons for interactive computing
launch_buttons:
  notebook_interface: "classic"  # Interface for Jupyter notebooks
  binderhub_url: ""
  colab_url: "https://colab.research.google.com"
  thebe: true  # Enable Thebe for live code execution

# HTML-specific settings
html:
  use_edit_page_button: false
  use_repository_button: false
  use_issues_button: false
  favicon: ""
  home_page_in_navbar: true

# Thebe configuration for live code
thebe:
  selector: "code-cell"
  codeMirror:
    theme: "default"
  kernelOptions:
    name: "python3" 

# Sphinx configuration
sphinx:
  config:
    nb_execution_mode: "off"
    nb_merge_streams: true
